<!-- templates/emails/trial_converted.html -->
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .email-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .email-header {
            text-align: center;
            font-size: 24px;
            color: #333;
        }
        .email-content {
            margin-top: 20px;
            font-size: 16px;
        }
        .email-footer {
            margin-top: 40px;
            font-size: 14px;
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            Welcome to Premium!
        </div>
        <div class="email-content">
            <p>Hello,</p>
            <p>Your trial has converted to a paid {{ plan_name }} subscription — welcome to Progress RPG Premium!</p>
            <p><a href="{{ account_url }}">Manage your subscription and billing details</a></p>
            <p>Best regards, <br/> The Team</p>
        </div>
        <div class="email-footer">
            <p>&copy; {{ current_year }} Progress RPG. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
