site_name: Progress RPG Backend Docs
site_description: Internal documentation for the Django backend
repo_url: https://github.com/progressrpg/ProgressRPG
repo_name: progressrpg/ProgressRPG
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: docs/internal/index.md
  - Backend Structure: docs/internal/backend-structure.md
  - Environment & Configuration: docs/internal/environment-and-configuration.md
  - Deployment Runbook: docs/internal/deployment-runbook.md
  - Architectural Decisions: docs/internal/architectural-decisions.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
